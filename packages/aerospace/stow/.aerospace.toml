# Place a copy of this default-config.toml to ~/.aerospace.toml
config-version = 2

after-startup-command = [
  # JankyBorders has a built-in detection of already running process,
  # so it won't be run twice on AeroSpace restart
  'exec-and-forget borders active_color=0xff61afef inactive_color=0x00000000 width=5.0',
  'exec-and-forget sketchybar',
]
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

start-at-login = true
auto-reload-config = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# on-focus-changed = "move-mouse window-lazy-center"
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = []

[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 2
outer.bottom = 2
outer.top = 2
outer.right = 2

# Floating windows
[[on-window-detected]]
if.app-id = 'com.apple.TextEdit'
run = ['layout floating']
[[on-window-detected]]
if.app-id = 'com.sublimetext.4'
run = ['layout floating']
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']
[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ['layout floating']
[[on-window-detected]]
if.app-id = 'com.apple.clock'
run = ['layout floating']
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = ['layout floating']

