[mode.main.binding]

# cmd-h = []     # Disable "hide application"
# cmd-alt-h = [] # Disable "hide others"

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# I need alt-e for accents on macOS, 
# otherwise I would have used it here
alt-w = 'workspace next --wrap-around'
alt-q = 'workspace prev --wrap-around'
# alt-w = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
# alt-shift-w = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'
alt-backtick = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
alt-shift-backtick = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-minus = 'resize smart -100'
alt-shift-equal = 'resize smart +100'
alt-shift-backspace = 'resize width 2200'

